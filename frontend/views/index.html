<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia Cubillos - Catálogo de Medicamentos</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <img src="../images/logo.png" alt="Farmacia Cubillos" class="logo">
                <div class="header-buttons">
                    <a href="login.html" class="btn btn-outline">Ingresar</a>
                    <a href="registro.html" class="btn btn-primary">Registrarse</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">Catalogo de Medicamentos</h1>
        
        <div class="search-section">
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input type="text" placeholder="Buscar por nombre o codigo" class="search-input">
            </div>
            
            <button class="filter-btn">
                Categoria
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>
    </main>
</body>
</html>
