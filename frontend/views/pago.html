<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Farmacia Cubillos</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="catalog-header">
        <div class="container">
            <div class="catalog-top">
                <a href="catalogo.html">
                    <img src="../images/logo.png" alt="Farmacia Cubillos" class="logo-small">
                </a>
                <h2 style="color: #1a472a; flex: 1; text-align: center;">Finalizar Compra</h2>
            </div>
        </div>
    </header>

    <main class="checkout-main">
        <div class="container">
            <div class="checkout-layout">
                <!-- Formulario de datos -->
                <div class="checkout-form-section">
                    <div class="checkout-card">
                        <h3 class="checkout-section-title">Datos de Entrega</h3>
                        <form id="checkoutForm" class="checkout-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Nombre Completo *</label>
                                    <input type="text" required class="form-input" placeholder="Juan Pérez">
                                </div>
                                <div class="form-group">
                                    <label>Teléfono *</label>
                                    <input type="tel" required class="form-input" placeholder="3001234567">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Correo Electrónico *</label>
                                <input type="email" required class="form-input" placeholder="correo@ejemplo.com">
                            </div>

                            <div class="form-group">
                                <label>Dirección de Entrega *</label>
                                <input type="text" required class="form-input" placeholder="Calle 123 #45-67">
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Ciudad *</label>
                                    <input type="text" required class="form-input" placeholder="Bogotá">
                                </div>
                                <div class="form-group">
                                    <label>Código Postal</label>
                                    <input type="text" class="form-input" placeholder="110111">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Notas adicionales</label>
                                <textarea class="form-input" rows="3" placeholder="Instrucciones especiales para la entrega..."></textarea>
                            </div>
                        </form>
                    </div>

                    <!-- Método de pago -->
                    <div class="checkout-card">
                        <h3 class="checkout-section-title">Método de Pago</h3>
                        <div class="payment-methods">
                            <label class="payment-option">
                                <input type="radio" name="payment" value="tarjeta" checked>
                                <div class="payment-option-content">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                        <line x1="1" y1="10" x2="23" y2="10"></line>
                                    </svg>
                                    <span>Tarjeta de Crédito/Débito</span>
                                </div>
                            </label>

                            <label class="payment-option">
                                <input type="radio" name="payment" value="pse">
                                <div class="payment-option-content">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                                    </svg>
                                    <span>PSE - Pago Seguro en Línea</span>
                                </div>
                            </label>

                            <label class="payment-option">
                                <input type="radio" name="payment" value="nequi">
                                <div class="payment-option-content">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                                        <line x1="12" y1="18" x2="12.01" y2="18"></line>
                                    </svg>
                                    <span>Nequi / Daviplata</span>
                                </div>
                            </label>

                            <label class="payment-option">
                                <input type="radio" name="payment" value="efectivo">
                                <div class="payment-option-content">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="12" y1="1" x2="12" y2="23"></line>
                                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                                    </svg>
                                    <span>Efectivo contra entrega</span>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Resumen del pedido -->
                <aside class="checkout-summary">
                    <div class="checkout-card">
                        <h3 class="checkout-section-title">Resumen del Pedido</h3>
                        
                        <div class="order-items" id="orderItems">
                            <!-- Los productos se cargarán aquí -->
                        </div>

                        <div class="order-totals">
                            <div class="order-total-row">
                                <span>Subtotal</span>
                                <span id="checkoutSubtotal">$0</span>
                            </div>
                            <div class="order-total-row">
                                <span>Envío</span>
                                <span id="checkoutShipping">$5.000</span>
                            </div>
                            <div class="order-total-row total">
                                <span>Total a Pagar</span>
                                <span id="checkoutTotal">$5.000</span>
                            </div>
                        </div>

                        <button class="btn btn-primary btn-full btn-large" onclick="finalizePurchase()">
                            Confirmar y Pagar
                        </button>

                        <a href="carrito.html" class="back-link">← Volver al carrito</a>
                    </div>

                    <div class="security-badge">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                        <span>Compra 100% segura y protegida</span>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script src="../js/pago.js"></script>
</body>
</html>
